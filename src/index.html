<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      Política de seguridad de contenido. La sesión vive en `localStorage`, así que cualquier
      script ajeno que llegue a ejecutarse en esta página puede leer el token de refresco y
      llevárselo. Esto no evita el fallo que lo inyecte, pero sí le quita casi todas las vías:
      solo corre el JavaScript servido desde este origen —nada en línea, nada de `eval`— y solo
      se habla con este origen y con la API.

      Lo que exige cada excepción:
      - `style-src 'unsafe-inline'`: Angular inserta los estilos de cada componente como
        `<style>` al montarlo. Con un estático no hay forma de firmarlos con un nonce por
        respuesta. Un estilo inyectado no ejecuta código.
      - `img-src data:`: el favicon se genera en tiempo de ejecución como `data:` (sigue al
        color elegido) y el fondo de la pantalla de acceso es un SVG en `data:`.
      - `connect-src` con el origen de la API: en producción vive en otro dominio. Tiene que
        ser el mismo que `API_ORIGIN`; si cambia uno y no el otro, la aplicación no puede
        pedir nada. Lo comprueba `content-security-policy.spec.ts`.

      Que no haya ningún script en línea depende de `inlineCritical: false` en `angular.json`:
      con el CSS crítico en línea, Angular carga el resto con un `onload="…"`, que esta política
      bloquea, y la página se queda con los estilos a medias.

      `frame-ancestors` no se puede declarar en una etiqueta `<meta>`: el navegador lo ignora.
      Esa y las demás cabeceras van en el servidor (ver README, «Cabeceras de seguridad»).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.fin-scope.app; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>FinScope</title>
    <base href="/" />
    <!--
      `viewport-fit=cover` no es decorativo: sin él, `env(safe-area-inset-*)` vale cero en
      iOS y las reservas de zona segura que ya hacen la barra inferior y los avisos no se
      aplican nunca. Instalada en la pantalla de inicio, la aplicación ocupa la pantalla
      entera, así que sin esto el botón de registrar acabaría bajo la barra de gestos.

      `maximum-scale=1` y `user-scalable=no` quitan el zoom a pellizco y el de doble toque. No
      es un capricho de maquetación: instalada en el teléfono, la aplicación se maneja con el
      pulgar sobre listas, chips y una barra inferior, y ahí el pellizco se dispara solo al
      desplazar con dos dedos y el doble toque al insistir sobre una fila que tardó en
      responder. La escala se queda entonces a medias, sin barra de direcciones donde tocar
      dos veces para deshacerla, y la única salida es cerrar la aplicación.

      En Safari dentro de una pestaña estos dos valores se ignoran a propósito —accesibilidad—,
      pero sí se respetan cuando se abre desde la pantalla de inicio, que es el caso que duele.
      El tamaño de letra del sistema se sigue obedeciendo: lo garantiza
      `-webkit-text-size-adjust: 100%` en la puesta a cero, que es otra cosa que el zoom.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Control de gastos e ingresos personales." />
    <!--
      El color de la interfaz del navegador. Va por duplicado y no como valor único porque
      la aplicación tiene tema claro y oscuro, y el manifiesto solo admite uno: estos dos
      sí siguen al sistema, y son los que mandan mientras la aplicación está abierta.
      Coinciden con `--fs-surface` de cada tema, que es el color de la barra superior.
    -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171d25" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      iOS toma de aquí el icono de la pantalla de inicio. Desde iOS 16.4 también sabe leer
      los del manifiesto, pero esta sigue siendo la vía fiable, y es la única en versiones
      anteriores. Sin transparencia y sin esquinas redondeadas: el sistema pone las suyas.
    -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!--
      Que se abra sin barra de direcciones al instalarla. El nombre sin prefijo es el
      estándar y es el que hay que poner: Chrome avisa en consola de que el de Apple está
      obsoleto. El de Apple se queda al lado, y no en su lugar, porque en iOS anterior a
      16.4 es la única forma de pedirlo —desde esa versión basta con `display: standalone`
      del manifiesto—. Los dos dicen lo mismo, así que tenerlos juntos no se contradice.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinScope" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>FinScope necesita JavaScript para funcionar.</noscript>
  </body>
</html>
